[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

# AGENTS.md §5 lint policy. `unwrap_used` / `expect_used` are denied for
# non-test code; unit tests inside a crate re-allow them with
# `#[allow(clippy::unwrap_used, clippy::expect_used)]` on the test module.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
todo = "deny"
unimplemented = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
unused_result_ok = "deny"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy", "charset"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
bytes = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"

chua-engine = { path = "crates/engine" }
